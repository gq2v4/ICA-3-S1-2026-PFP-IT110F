<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <title>Contact Us</title>

    <style>

        body{

        .contact-container{
            width:85%;
            max-width:900px;
            margin:50px auto;
            background-color:#251604;
            padding:40px;
            border-radius:10px;
            text-align:left;
        }

        h1{
            font-size:64px;
            color:#f08f68;

        }

        .logo{
            margin-bottom:25px;
        }

        .logo img{
            width:267px;
            height:93px;
        }

        .contact-info p{
            font-size:21px;
            margin:12px 0;
        }

        .contact-info a{
            color:white;
            text-decoration:underline;
        }

        h2{
            color:#f08f68;
            margin-top:45px;
        }

        iframe{
            width:100%;
            height:400px;
            border:0;
            margin-top:20px;
            border-radius:8px;
        }

    </style>

</head>

<body>

    <div class="contact-container">

        </div>

        <div class="contact-info">

            <p>info@yourcompany.com</p>

            <p>
                <a href="tel:+6512345678">

                </a>

            <p>
                123 Business Avenue<br>
                Singapore 018956
            </p>

        </div>

        <h2>Our Location</h2>

        <iframe
            src="https://www.google.com/maps?q=Singapore&output=embed"
            allowfullscreen=""
            loading="lazy">
        </iframe>

    </div>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
<title>Bubble Tea Bros</title>

<style>
body{
    font-family: Arial, sans-serif;
    background-color:#f5f5f5;
    margin:0;
    padding:0;
}

header{
    background:#141414;
    color:#f08f68;
    text-align:center;
    padding:20px;
}

.container{
    width:80%;
    margin:auto;
    margin-top:20px;
}

section{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:10px;
    box-shadow:0 0 8px gray;
}

h2{
    color:#f08f68;
}

label{
    display:block;
    margin-top:10px;
    font-weight:bold;
}

input[type=text],
input[type=email],
input[type=tel],
input[type=number],
select,
textarea{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:5px;
}

textarea{
    resize:vertical;
}

input[type=submit],
input[type=reset]{
    margin-top:15px;
    padding:10px 20px;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

input[type=submit]{
    background:#0e0f0e;
    color:#f08f68;
}

input[type=reset]{
    background:#f44336;
    color:white;
}

footer{
    background:#333;
    color:white;
    text-align:center;
    padding:15px;
}
</style>

</head>

<body>

<header>
    <h1>Bubble Tea Bros</h1>
    <p>Order Form, Enquiries & Feedback</p>
</header>

<div class="container">

<!-- ORDER FORM -->
<section>

<h2>Bubble Tea Order Form</h2>

<form>

<label>Full Name</label>
<input type="text" name="fullname" required>

<label>Email</label>
<input type="email" name="email" required>

<label>Phone Number</label>
<input type="tel" name="phone">

<label>Select Drink</label>
<select name="drink">
    <option>Classic Milk Tea</option>
    <option>Brown Sugar Milk Tea</option>
    <option>Taro Milk Tea</option>
    <option>Matcha Milk Tea</option>
    <option>Thai Milk Tea</option>
</select>

<label>Size</label>
<select name="size">
    <option>Small</option>
    <option>Medium</option>
    <option>Large</option>
</select>

<label>Sugar Level</label>
<select name="sugar">
    <option>0%</option>
    <option>25%</option>
    <option>50%</option>
    <option>75%</option>
    <option>100%</option>
</select>

<label>Ice Level</label>
<select name="ice">
    <option>No Ice</option>
    <option>Less Ice</option>
    <option>Normal Ice</option>
    <option>Extra Ice</option>
</select>

<label>Quantity</label>
<input type="number" min="1" max="10" value="1">

<label>Special Instructions</label>
<textarea rows="4"></textarea>

<input type="submit" value="Place Order">
<input type="reset" value="Clear Form">

</form>

</section>

<!-- ENQUIRIES -->

<section>

<h2>Enquiries Form</h2>

<form>

<label>Name</label>
<input type="text" required>

<label>Email</label>
<input type="email" required>

<label>Subject</label>
<input type="text">

<label>Your Enquiry</label>
<textarea rows="5"></textarea>

<input type="submit" value="Submit Enquiry">
<input type="reset" value="Reset">

</form>

</section>

<!-- FEEDBACK -->

<section>

<h2>Feedback Form</h2>

<form>

<label>Name</label>
<input type="text">

<label>Email</label>
<input type="email">

<label>Rate Our Service</label>

<input type="radio" name="rating"> Excellent<br>
<input type="radio" name="rating"> Good<br>
<input type="radio" name="rating"> Average<br>
<input type="radio" name="rating"> Poor<br>

<label>What did you like?</label>
<textarea rows="4"></textarea>

<label>Suggestions for Improvement</label>
<textarea rows="4"></textarea>

<input type="submit" value="Send Feedback">
<input type="reset" value="Reset">

</form>

</section>

</div>

<footer>
    <p>&copy; 2026 Bubble Tea Bros. All Rights Reserved.</p>
</footer>

</body>
</html>
